# GENERATED from threading_real_cell_calibrated_wrist.yaml with the 2026-10-10 camera calibration.
# Differs from it in `cameras` and the white-board table_visual_* (re-fitted 2026-10-11, see below).
# Lives in real2sim/zed_capture/calib_20261010/ (README there).
# agentview: re-mounted ZED 2i, solved from run_1010_2327 (samples 000-006 dropped: the board
#   was bumped). Reprojection 0.25 px; leave-one-out moves it <= 6.6 mm / 0.56 deg.
#   fovy 50.0 is the OLD choice, NOT re-optimised for the new pose.
# robot0_eye_in_hand: back-of-hand ZED-M, frame = robot0_right_hand (no 45 deg flange step).
#   Same-session LOO <= 3.9 mm / 0.59 deg, but run_1010 vs run_1010_2327 disagree by
#   7.1 mm / 1.1 deg (unresolved) and randomize is false.
# Real side MUST use the refitted wrist intrinsics (data/wrist_intrinsics.json: fx 778.7
#   cx 648.7 cy 357.7); the ZED-M factory D is wrong. Largest square about that
#   principal point = 49.344 deg, so fovy 49.014 still fits.
# Sim gripper = Robotiq 2F-85 (gripper_types + mount, bottom of file), as on the real arm.
enabled: 1
arena_from_real2sim: 1
# WORK SURFACE HEIGHT (2026-10-11). arena_from_real2sim gives the MAT at base z +0.0207
#   (shared with PegInsertion_D0); the white board lies on it and was never modelled.
#   Estimates of the board top, base frame: wrist-photo edges 0.0357 (sample_011) / 0.0213
#   (sample_019), lines cross at 0.028 with a common -12 px hand-eye bias; tape 753 mm vs
#   the scene-fitted size -> ~0.026; ChArUco on its clipboard 0.0329 minus the clipboard
#   -> ~0.030. Nominal 0.0285 (= +7.8 mm), dr_base_height +-7.5 mm covers 0.021-0.036,
#   i.e. every single estimate. A fingertip touch-off on the real board would replace this.
table_top_dz: 0.0078
# WHITE BOARD re-fitted 2026-10-11 from the run_1010_2327 scene photos (sample_011/019):
#   all four board edges detected in the undistorted photo (line rms 0.2-0.3 px), rectangle
#   fitted ON THE WORK-SURFACE PLANE (base z 0.0285) so the sim edges land on the real ones.
#   Edge residual 0.3-0.6 px rms per side at 1280x720; the two photos agree to < 0.5 mm.
#   board in base frame: centre (0.5028, 0.0090), x[0.1282, 0.8775] y[-0.3725, 0.3905].
#   The board HAS MOVED since the 09-23 tape measurement (centre was (0.5000, 0.1095)):
#   ~100 mm toward the robot's -y side. Yaw 0.76 deg (fixing it at 0 costs 1.5-2 px/side).
#   Fitted size 0.749 x 0.763 vs the tape's 753 x 753: the residual is the scene extrinsic
#   (+-6.6 mm / 0.56 deg). This entry is an IMAGE match, not a physical measurement.
#   (On the old plane z 0.0207 the same edges gave half 0.3806/0.3875, offset 0.0181/-0.0334.)
table_visual_half:
- 0.3747
- 0.3815
table_visual_offset:
- 0.0138
- -0.0250
table_visual_yaw_deg: 0.756
