# DIAGNOSTIC ONLY (2026-10-25): diag_cell_noexec.yaml + no per-episode arm / gripper physics DR. Not for deployment.
# 2026-10-15 cell (Threading, Robotiq) = calib_20261014/threading_real_cell_20261014.yaml with TWO changes,
# both from the 10-15 visit (calib_20261015/README.md):
#   1. control_freq 10 (README §2, decided with the owner): one action = 100 ms of OSC. Every 20 Hz
#      expert / dataset / stage-1 is invalid on this cell (CLAUDE.md rule #37). The real side runs
#      run_teleop_session.py --rate 10 and robot_client.py --hz 10; policy_server refuses another rate.
#   2. wrist camera nominal pose re-solved (README §3, scene camera held FIXED at its validated pose,
#      tools/solve_wrist_fixed_scene.py; LOO <= 2.6 mm / 0.32 deg; held-out gripper IoU 0.690 -> 0.755).
#      Moved 6.2 mm / 0.79 deg vs the 10-13 solve. The solver output (data/wrist_run_1015_1915/) is on
#      the workstation, not in git (data/ is ignored); the numbers below are the README's.
#      Wrist DR left at the 10-14 width on purpose: narrowing it is the owner's call (README §3 suggests
#      +-(6, 6, 8) mm / +-(1.5, 1.5, 2) deg).
# NOT changed: tripod yaw range [-45.6, -35.6] (the real tripod sat at -36.0, at the edge: centre it at
#   ~-40 on the next visit or widen the range), table height (0.0285, the 10-15 hand touch is unusable).
inherit: ../calib_20261014/threading_real_cell_20261014.yaml
control_freq: 10
# `cameras` is replaced wholesale by inherit (env/sim2real.py load_sim2real): agentview restated verbatim
cameras:
- name: agentview
  frame: base
  pos:
  - 0.23173
  - 0.55526
  - 0.52272
  # 2026-10-15: own DR widths, wider than the cell-wide 11 mm / 1 deg (owner: cover what can go wrong). Measured
  #   error is far smaller (validated 1-2 px; one cable bump = 0.30 deg, translation <~1 mm): +-15 mm / +-1.5 deg
  #   leaves 5x for another bump. Fovy +-1 (cell-wide).
  dr_pos: 0.015
  dr_rot_deg: 1.5
  # 2026-10-14: rotated 0.30 deg (bump), pos unchanged. 10-13: [0.15479, -0.29452, 0.85353, -0.40097]
  quat:
  - 0.15341
  - -0.29297
  - 0.85476
  - -0.40002
  fovy: 50.0
- name: robot0_eye_in_hand
  frame: hand
  # 2026-10-15 (README "Camera DR"): randomize true with its OWN, PER-AXIS widths, wide on purpose (owner:
  #   cover what can go wrong; the wrist is re-solved on the next visit). The render fit against the real wrist
  #   frames (tools/fit_layout_wrist.py) needs, in the hand frame, x -0.8..1.8 / y 5.1..6.1 / z 7.2..15.5 mm and
  #   tilts <= 2.1 deg, roll up to 4.0 deg depending on the model => +-(6, 10, 20) mm, +-(3, 3, 4.5) deg (x/y tilt,
  #   z roll about the optical axis), fovy +-1. (An isotropic +-20 mm / +-4.5 deg box moved the needle 20 px median,
  #   44 px max in the 224 wrist view and dropped the gripper IoU vs nominal to 0.55 -- far beyond the real error,
  #   which matches the OLD +-10 mm / 0.5 deg box's 0.73.) Nominal pose: the 10-15 fixed-scene solve (header).
  #   10-13 solve was pos [-0.07053, -0.03118, 0.01228], quat [0.93013, -0.14733, 0.03582, -0.33447].
  randomize: true
  dr_pos: [0.006, 0.010, 0.020]
  dr_rot_deg: [3.0, 3.0, 4.5]
  dr_fovy_deg: 1.0
  # real side: undistort wrist frames with the REFITTED K/D (factory D is wrong)
  real_intrinsics: ../calib_20261010/data/wrist_intrinsics.json
  pos:
  - -0.07452
  - -0.03588
  - 0.01144
  quat:
  - 0.92782
  - -0.15101
  - 0.03893
  - -0.33888
  fovy: 49.014
# 3. EXECUTION LAYER (2026-10-17, env/exec_layer.py; README "Execution layer in the sim"): what happens between an
#    action and the arm on the robot -- the deploy reference-arm OSC, the TCP caps (8 cm/s, 0.4 rad/s, 3 cm lead),
#    the 100 Hz ramp, franka_ros2 joint impedance with the real gains -- now also in the sim. Arm parameters:
#    open-loop system ID on the two 10-15 sim_ref tracking runs (scripts/fit_arm_twin.py,
#    arm_fit/arm_params_1015.json; joint rms 2.6 / 2.6 / 2.0 / 1.9 / 7.6 / 4.5 / 1.8 mrad, from 4.0 / 4.7 / 2.6 /
#    3.8 / 9.4 / 9.6 / 1.8). Out of sample it reproduces the 10-15 reseed stall (x 0.00-0.02 done/step, real 0.01-0.04).
#    ⚠️ j1 is not identified (it barely moves in the test): nominal armature, j2-like stiction / damping.
#    ⚠️ PROVISIONAL: fitted before the 10-16 Desk payload fix; refit on the next tracking run (NEXT_VISIT).
#    NO SPEED LIMITS (owner, 2026-10-17: as close to the GELLO teleop as possible; the human exceeds 8 cm/s on 18 % of
#    steps): the TCP / rotation / lead caps, the slow band and robot_client's per-step joint clip are all off, here
#    AND on the robot -- policy_server and robot_client take them from this block. What stays: the z_min floor
#    (z_min_base 0.038 above the base = world 0.950 on the deploy reference; the demos' lowest grip site is 0.041) and
#    the 8 cm re-sync when contact blocks the arm.
exec_layer: null
# 4. LAYOUT (2026-10-19, owner: cover the real placements, not so wide that it stops being learnable).
#    Real, 15 demos: needle x 0.546-0.556, y -0.120..-0.116, yaw -112..-93 by the wrist refit (the scene camera reads
#    ~9 deg lower: -120..-102; which is right is open, README "10-18 data in the sim"); tripod (scene) x 0.517-0.524,
#    y 0.179-0.188, yaw -38..-32 (4 of the 10-15 demos were outside the old [-45.6, -35.6]).
#    Learnable references: MimicGen D0 (expert 0.98) needle +-75 / +-50 mm / +-30 deg with the tripod FIXED; the old Franka
#    RealCell (0.957) the same needle box + tripod +-30 mm / +-5 deg.
#    ⇒ needle: the D0-size box, yaw +-30 re-centred on -105 so both readings keep >= 12 deg of margin;
#      tripod: re-centred on the real placement, +-25 mm / +-10 deg (covers the placements + the ~1 cm camera
#      uncertainty; much smaller than the 10-17 trial of +-40 mm / 25 deg). All within the 10-17 visibility check
#      (>= 13 px inside the scene crop). ⚠️ tripod yaw sets j7 at the insertion: check MimicGen success per yaw bin.
layout_needle_x: [0.475, 0.625]
layout_needle_y: [-0.17, -0.07]
layout_needle_z_rot_deg: [-135, -75]
layout_tripod_x: [0.496, 0.546]
layout_tripod_y: [0.158, 0.208]
layout_tripod_z_rot_deg: [-45, -25]
# 5. GRIPPER CONTACT (2026-10-18 grasp grid, README "10-18 robot visit"): critically damped Robotiq contact. The robot
#    lifted the needle 12/12; the sim with robosuite's finger contact (solref 0.01 0.25) 1/12, with 0.02 1.0 12/12,
#    trial by trial (needle pose per trial from the hover wrist frame, same script, same execution layer).
#    2026-10-21: STIFFENED. With 0.02 1.0 the fingers sank ~13 mm into the 40 mm handle (every demo; up to 40 mm in IBRL
#    rollouts): knuckle at hold 0.53 vs the robot's 0.440-0.444 on all 12 grid trials (steps.jsonl `fingers`). The
#    needle hung on penetration springs and turned / slipped in the hand. Sweep (grasp_twin --real, 12 trials,
#    README "10-21 gripper contact"): timeconst 0.005 + solmix 1000 (the gripper's values govern its pairs; the default
#    mix averaged in the needle's 0.02) -> knuckle 0.453, penetration <= 2.8 mm, lifted 12/12, agrees 11/11.
#    0.004 hits the table 7/12; a stiffer solimp lifts 0/12; an actuator force cap cannot close the fingers.
#    The dampratio DR below still applies. ALL data / ckpts made before this change are void.
gripper_contact_solref: [0.005, 1.0]
gripper_contact_solmix: 1000
#    2026-10-21: robosuite's Robotiq 85 has OPEN four-bar loops (only a 0.4-stiffness tendon with coefficients 1,-3,1):
#    the pads closed tilted 20-31 deg each, a V-shaped pinch that met the handle edge-first and tipped it, and the loop
#    links (convex hulls) collided with each other 3-13 mm deep. true = joint equalities close both loops (pads stay
#    parallel: 87 mm open, 40 mm at knuckle 0.445 = the real 0.44 on the handle) + the loop links' contacts excluded.
gripper_parallel_linkage: true
#    With the loops closed the fingers stay parallel on the handle, but the uncapped kp-20 servo still pressed them
#    ~5 mm into it (knuckle 0.516). Driver force cap (grasp_twin --real, 12 trials): 2.0 -> 0.482 / 1.7 mm,
#    1.0 -> 0.474 / 1.1 mm, 0.5 -> 0.471 / 0.8 mm; all lift 12/12 and agree 11/11 (also at dampratio 0.7).
gripper_force_limit: 1.0
# 2026-10-22: the real Robotiq is black throughout; robosuite's has light outer knuckles (0.79 0.82 0.93) and
# fingertips (0.9), which the wrist camera sees. Every visible gripper geom = robosuite's own dark grey. Rendering only.
gripper_visual_rgba: [0.1, 0.1, 0.1, 1.0]
# 2026-10-22 OBJECT CONTACT: needle / tripod / table collision geoms. MimicGen's solref 0.02 let the E2 IBRL policy
#   press the needle into the ring's 4 mm bars (median 2.5 mm, max 11 mm, >2 mm in 57 % of episodes; the 3 mm
#   clearance per side then lets a misaligned needle squeeze through) and the tripod legs 4-11 mm into the table.
#   0.005 + solmix 1000 (60 E2 episodes): needle-ring 0.6 / 2.6 mm (median / max, >2 mm 2 %), tripod-table 0.5 / 4.8,
#   needle-table 0.1 / 4.7; scripted expert strict 300/300. E2's own success fell ~0.8 -> 0.58: part of it was the
#   squeeze. ALL data / ckpts made before this change are void.
object_contact_solref: [0.005, 1.0]
object_contact_solmix: 1000
# 2026-10-22 TABLE IMPACT: a control step with > 35 N summed gripper <-> table normal force ends the episode as a failure
#   (train and eval; the robot's collision reflex). Expert: max 0.9 N (1 contact step in 40 episodes); E2 IBRL: contact
#   in 82 % of episodes, up to 759 N. The exec-layer floor (z_min_above_table / gripper_clear_table) bounds the COMMAND
#   only: uncapped (owner, 10-17) the arm overshoots it on a fast descent (E2: site 6-12 mm at contact with the command
#   16+ mm higher), so this termination is what teaches the policy to slow down near the table.
#   35 N (was 5): the 15 real demos replayed in the sim (replay_real_demos_sim.py, track) peak at 0 N (11), 3.7, 13.6,
#   14.4, 17.6 N -- the operator's fingertips graze the table after closing (FK: lowest point -2..0 mm in 6 of 15) and
#   no real demo hit it, so 5 N would have failed 3 of them. 35 N = 2x the real maximum; E2's hits went to 759 N.
table_impact_force: 35.0
# 6. PHYSICS DR (2026-10-19, TRAIN_PLAN.md; applied by the wrapper per episode, off in every deterministic copy):
#    arm armature / stiction x U(0.7, 1.3) per joint (fit residual j5 / j6 still 5-6 mrad, stiction is direction
#    dependent); gripper contact dampratio U(0.7, 1.0) (the grasp grid showed 1.0 works, not where it stops).
dr_arm_armature: 0.0
dr_arm_frictionloss: 0.0
dr_gripper_dampratio: null
