# ============================================================================
# IBRL on the REAL-CELL Threading geometry.
#
# IDENTICAL to release/cfgs/mimicgen/threading_d0_state_ibrl_source_strict.yaml
# (the run that reached 0.88-0.90 strict on the ORIGINAL geometry) except for the
# lines marked ### REAL-CELL:
#   1. sim2real_cell    -> table +20.8 mm above the base, parts shifted +0.10 m in
#                          y, plus the cell's dr_base_height (+-5 mm). Visual DR in
#                          the same file is inert here (state observations).
#   2. bc_policy        -> single-step MLP BC trained on real-cell MimicGen demos
#                          (the reference used a FLOW prior -- a third difference,
#                          chosen for speed; weigh it before comparing to 0.88-0.90)
#   3. preload_datapath -> the same real-cell demos
#
# Why the assets had to change: the reference source expert scores 0.880 on the
# original geometry and 0.000 on this cell (n=50 each, source physics), so the
# old prior and the core-D0 preload demos carry no usable signal here.
#
# ⚠️ dr_base_height is a SECOND change relative to the reference recipe, which had
# no base randomisation. It was requested for sim-to-real robustness. If this run
# underperforms the reference, rerun with dr_base_height 0 before blaming the
# geometry or the demos (iron law #9).
#
# Run (via scripts/pipeline_realcell.sh, which also builds the prior first):
#   python train_rl.py --config_path release/cfgs/sim2real/threading_realcell_state_ibrl.yaml \
#       --save_dir exps/mimicgen/threading_realcell_ibrl_seed1
# ============================================================================
# IBRL on Threading_D0 — SOURCE domain, trained against STRICT success.
#
# Mirrors the config that produced exps/mimicgen/threading_ibrl_source_seed1
# (state_stack=1, joint-space init sigma 0.1, flow-BC prior, 400k steps), with
# ONE change: strict_success is ENABLED. The original source agent was trained
# on the RAW instantaneous position success and reward-hacks it (raw 100% but
# strict-success only 68% on source: ram / clip-through / shove-the-ring). With
# strict gating (dwell K=3 + ring-displacement<0.04) the +1 reward only fires
# when the needle genuinely threads and HOLDS, so RL must learn honest insertion.
#
# strict_success is applied to BOTH train and eval (env/strict_success.py), so
# the reward and the topk-saved metric agree. eval is on SOURCE (mode=none) so
# the saver keeps the best strict-success-on-source agent.
#
# Run:
#   python train_rl.py --config_path release/cfgs/mimicgen/threading_d0_state_ibrl_source_strict.yaml \
#       --save_dir exps/mimicgen/threading_ibrl_source_strict_seed1
task_name: "Threading_D0"
sim2real_cell: "release/cfgs/sim2real/threading_real_cell.yaml"   ### REAL-CELL
episode_length: 400
end_on_success: 1
use_state: 1
# No images are used by a state agent, so do not build an EGL context for it.
# Beyond the wasted render, the cell now carries dr_background_image: without
# this flag the state run pays a JPEG decode + texture upload on every reset for
# a randomisation it cannot see, and it is the PIXEL distillation data that is
# supposed to carry the photo backgrounds, not this stage.
state_only_no_render: 1
state_stack: 1
obs_stack: 1
prop_stack: 1
nstep: 3
discount: 0.99
mix_rl_rate: 0.5

# BC prior (same flow-BC prior the original source agent used) + seed demos.
bc_policy: "exps/mimicgen/threading_realcell_mlp_bc_seed1/model0.pt"   ### REAL-CELL (MLP prior; flow was too slow)
preload_num_data: 10
preload_datapath: "release/data/mimicgen/generated/threading_realcell/processed_data96.hdf5"   ### REAL-CELL
num_warm_up_episode: 50

num_train_step: 400000
replay_buffer_size: 1000
num_critic_update: 5
update_freq: 2
log_per_step: 10000
num_eval_episode: 50
mp_eval: 1
use_wb: 1
seed: 1
stddev_max: 0.1
stddev_min: 0.1

q_agent:
  act_method: "ibrl"
  bootstrap_method: "ibrl"
  ibrl_eps_greedy: 1
  state_critic:
    num_q: 5
    num_k: 2
    layer_norm: 1
    hidden_dim: 1024
    num_layer: 3
  state_actor:
    hidden_dim: 1024
    num_layer: 3
    dropout: 0
    layer_norm: 0

# Demo-collection-style init (matches the original source agent).
train_hand_init_perturb_joint_sigma: 0.1
eval_hand_init_perturb_joint_sigma: 0.1

# SOURCE domain on both train and eval (no contact-phase shift).
train_domain_shift:
  mode: "none"
eval_domain_shift:
  mode: "none"

# THE change vs the original source agent: honest success objective.
strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
  max_needle_speed: 0.0
