# Square_D0 — single-step MLP BC (StateBcPolicy) on the 1000 official MimicGen
# core demos, trained + evaluated on the SOURCE domain (no shift). Serves as the
# BC prior for the source IBRL run (square_d0_state_ibrl_source.yaml).
#
# Square_D0 state = 23 (eef_pos[3] + eef_quat[4] + gripper_qpos[2] + object[14]),
# action_dim = 7 (OSC_POSE + gripper). ~151 mean steps/demo.
#
# NOTE: strict_success + domain_shift are Threading-only (resolve_threading_bindings
# raises NotImplementedError for other envs) — both left OFF here. Eval uses the
# raw MimicGen success (nut on peg) and robosuite's default σ=0.02 joint init
# (in-distribution with the official demos).
#
#   python train_bc.py --config_path release/cfgs/mimicgen/square_d0_state_source_mlp_bc.yaml \
#       --save_dir exps/mimicgen/square_source_mlp_bc_n1000_seed1

seed: 1

dataset:
  path: /home/Chenyang/ibrl/release/data/mimicgen/core/square_d0/processed_data96.hdf5
  num_data: -1                # all 1000 demos
  use_state: 1
  state_stack: 1
  prop_stack: 1
  obs_stack: 1
  action_horizon: 1           # single-step (StateBcPolicy)
  eval_episode_len: 400
  val_ratio: 0.0

# single-step MLP head — same arch as the Threading source MLP BC
state_policy:
  num_layer: 3
  hidden_dim: 1024
  dropout: 0.0
  layer_norm: 0

batch_size: 256
lr: 0.0001
weight_decay: 0.0
grad_clip: 5
num_epoch: 2000
epoch_len: 100
eval_period: 50
num_eval_episode: 50

# eval on SOURCE (no shift), default init distribution.
eval_target_during_training: 0
eval_domain_shift:
  mode: none

use_wb: 1
save_dir: exps/mimicgen/square_source_mlp_bc_n1000_seed1
