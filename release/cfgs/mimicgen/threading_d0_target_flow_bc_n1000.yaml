# Flow BC on the 1000 TARGET expert demos (threading_d0_target_expert_n1000),
# in-domain: train + eval on the §12 dynamics-only TARGET at hand_init σ=0.1
# (the SAME conditions the demos were collected under, and the SAME σ/target the
# residual/SimDist line is evaluated at — so it's directly comparable).
#
# Purpose: does a flow BC head trained on 1000 σ=0.1 target successes reach/beat
# the residual's ~0.90? (SimDist's bottleneck is the policy head — flow + lots of
# target demos is the cheap offline lever.) Can then serve as a stronger base/prior.
#
# Run:
#   python train_bc.py --config_path release/cfgs/mimicgen/threading_d0_target_flow_bc_n1000.yaml \
#     --save_dir exps/mimicgen/threading_target_flow_bc_n1000_seed1
dataset:
  path: /home/Chenyang/ibrl/release/data/mimicgen/threading_d0_target_expert_n1000/dataset.hdf5
  use_state: 1
  action_horizon: 16      # = flow_policy.pred_horizon
  num_data: 1000
  eval_episode_len: 400
  val_ratio: 0.1
  hand_init_perturb: null
  hand_init_perturb_joint_sigma: 0.1   # dataset eval env init σ (matches collection)
use_flow: 1
flow_policy:
  backbone: "unet1d"
  unet_down_dims: [64, 128, 256]
  diffusion_step_embed_dim: 128
  kernel_size: 5
  n_groups: 8
  obs_feat_dim: 128
  obs_mlp_layers: [256]
  time_scale: 1000.0
  pred_horizon: 16
  action_horizon: 8
  num_inference_steps: 10
  use_ema: 1
  ema_decay: 0.9999
  normalize_obs: 1          # §15 state z-score + action min/max normalization
  normalize_action: 1
num_epoch: 2000
epoch_len: 100
batch_size: 256
lr: 1e-4
weight_decay: 1e-6
use_wb: 1
num_eval_episode: 100
eval_period: 50
val_period: 10
val_batches: 5
# in-training eval on TARGET (topk saver ranks by target), at σ=0.1
eval_target_during_training: 1
eval_hand_init_perturb: null
eval_hand_init_perturb_joint_sigma: 0.1
eval_domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  ring_size_scale: 0.85
  ring_friction_scale: 2.0
  mask_hole_offset_in_obs: false
# match the residual/adapt eval gating (honest insertion, anti clip-through)
strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
