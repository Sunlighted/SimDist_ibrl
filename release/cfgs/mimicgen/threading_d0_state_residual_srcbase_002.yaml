# Model-free residual RL (ResFiT-style) on a frozen SOURCE-learned SimDist base.
#
# Comparison arm for threading_simdist_adapt_long_0.02_h5_seed1 (model-based
# dynamics adaptation from the SAME source SimDist). Here the source SimDist
# (threading_simdist_diversev2_h5_seed1/latest.pt) is the FROZEN base and a
# residual RL policy adapts online in the TARGET domain. Question: does the
# model-free residual adapt FASTER than SimDist dynamics adaptation, both
# starting from the same source SimDist?
#
# COLD START (no borrowed target-adapted warm-start): the base is source (not
# target-adapted), so the §26 IQL-pretrained critic / 30k-adapt rollout anchor
# are intentionally DROPPED (they belong to a different, target-adapted base).
# offline anchor = 20 TARGET demos + successful MPPI-base rollouts harvested in
# warmup; critic + residual actor cold-start. critic_warmup_steps=10000 +
# progressive_clipping_steps=5000 soften the cold start (avoid the early dip).
#
# All OTHER residual RL hyperparameters match threading_residual_30k_seed1:
#   nstep=3, num_critic_update=5 (UTD), update_freq=2, actor_lr=1e-5,
#   action_scale=0.1, actor_q_agg=min, num_critics=10/num_min=2, batch 256,
#   offline_fraction 0.5, learning_starts 5000, warmup_noise 0.2, 300k steps.
#
# 0.02 setting: hand_init σ=0.02 for BOTH train (rollout collection) and eval,
# matching adapt_long_0.02's eval_hand_init_perturb_joint_sigma=0.02 (the adapt
# collection env also uses the eval sigma).
task_name: "Threading_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1     # MUST match the SimDist base's obs space
obs_stack: 1
prop_stack: 1

nstep: 3           # match residual_30k
discount: 0.99
batch_size: 256
offline_fraction: 0.5
num_critic_update: 5      # UTD=5 (match residual_30k)
update_freq: 2            # match residual_30k
replay_buffer_size: 500000

# base = the SOURCE-learned SimDist (via a minimal cfg.yaml -> stage1_ckpt).
base_adapt_ckpt: "exps/mimicgen/threading_simdist_source_base_h5/latest.pt"

# offline RLPD anchor: 20 TARGET demos + successful MPPI-base rollouts harvested
# during warmup. NO target-adapted IQL warm-start (cold start).
offline_demo_path: "release/data/mimicgen/threading_d0_target_dynamics/dataset.hdf5"
offline_num_data: 20
offline_harvest_success: 100
offline_transition_path: ""   # dropped: belongs to the 30k target-adapted base
init_critic_from: ""          # dropped: cold critic
init_actor_from: ""           # dropped: cold residual actor

# warmup / schedule
learning_starts: 5000
warmup_noise_scale: 0.2
critic_warmup_steps: 10000    # cold-start (no IQL warm critic)
num_train_step: 300000        # match residual_30k
log_per_step: 1000            # eval every 1000 transitions
num_eval_episode: 100
mp_eval: 1
num_eval_proc: 10
use_wb: 1

stddev_max: 0.1
stddev_min: 0.1
stddev_step: 500000

# 0.02 setting (matches adapt_long_0.02's eval hand_init sigma)
hand_init_perturb_joint_sigma: 0.02

residual:
  base_policy_path: ""      # UNUSED (base is the SimDist ckpt above)
  action_scale: 0.1
  actor_q_agg: "min"
  progressive_clipping_steps: 5000   # cold-start ramp (no warm actor)
  actor_hidden_dim: 1024
  actor_num_layer: 3
  actor_layer_norm: 1
  critic_hidden_dim: 256
  critic_num_layer: 3
  critic_layer_norm: 1
  num_critics: 10
  num_min_critics: 2
  actor_lr: 0.00001         # 1e-5 (match residual_30k)
  critic_lr: 0.0001
  gamma: 0.99
  tau: 0.005
  policy_freq: 2
  policy_noise: 0.05
  noise_clip: 0.5
  residual_l2_coef: 0.0
  clamp_q_target: 1
  q_target_min: 0.0
  q_target_max: 1.0
  grad_clip: 10.0
  normalize_states: 1

# TARGET domain (train + eval share it): the §12 dynamics-only shift.
domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  mask_hole_offset_in_obs: false
  ring_size_scale: 0.85
  ring_friction_scale: 2.0

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
