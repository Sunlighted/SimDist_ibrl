### ★ 9000 PER SHARD x 4 shards = 36,000 episodes ~= 6.48M transitions, matching
### the pixel arms (4500 x 8 shards = the same 36,000). This must be set, not left
### at -1: with -1 the loader ingests all 100k episodes and `max_transitions` then
### evicts the OLDEST down to the cap, so the run would keep only the LAST ~36k --
### i.e. 2 of the 4 shards, and 2 of the 4 generation seeds. The pixel arms would
### be spread over 8 seeds and the state arm over 2, which is a difference in DATA
### SELECTION between arms that are supposed to differ only in observation space.
source_replay_num_data: 9000
### ★ B4 re-baseline (docs/simdist.md §45/§46). diverse_v2 is 20k trajectories --
### 5x UNDER the reference recipe, and not by choice: job 5113397 was sized to fit
### the fast-queueing 3 h tier. Every published state-vs-pixel delta rests on it,
### so it is PROVISIONAL until this run replaces it.
### Sharded like the pixel arm; both layouts named because a shard job that hits
### its walltime never reaches merge_shards.
source_replay_path: /scratch/yifanr/simdist/data/thr_d0_src_state100k/shard_*/dataset.hdf5+/scratch/yifanr/simdist/data/thr_d0_src_state100k/shard_*/_shard_*.hdf5
