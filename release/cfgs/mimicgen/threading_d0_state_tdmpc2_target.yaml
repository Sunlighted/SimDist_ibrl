# TD-MPC2 (online model-based RL) + IBRL prior — TARGET domain. CLAUDE.md §28.
#
# Same agent as the source arm; the ONLY change is the domain: the agent now
# interacts ONLINE with the §12 dynamics-only TARGET env (and is evaluated there).
# This is the arm to compare against the SimDist TARGET pipeline (§24 adapt,
# ~0.83-0.88 MPPI) and against the residual/perm-margin IBRL lines (§25/§26,
# 0.94-0.97): does learning the world model + Q ONLINE in the target beat
# distilling one and adapting it?
#
# Prior = the 20-target-demo MLP BC head (~25% target strict success) — the same
# frozen prior the residual (§20) and gated (§16) methods anchor on, so the
# comparison isolates the METHOD, not the prior.
#
# NOTE: this arm assumes the target sim is queryable online (sim2sim). For a true
# sim2real setting only the SOURCE arm is legitimate.
#
# Run:
#   python train_tdmpc2.py --config_path release/cfgs/mimicgen/threading_d0_state_tdmpc2_target.yaml \
#       --save_dir exps/mimicgen/threading_tdmpc2_target_seed1
task_name: "Threading_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1
obs_stack: 1
prop_stack: 1
discount: 0.99

# IBRL prior: the frozen TARGET-demo BC head (20 demos).
prior_path: "exps/mimicgen/threading_target_mlp_bc_n20_seed1/model0.pt"
prior_kind: "bc"

# Vanilla IBRL recipe (NO prior-margin anneal — threading_ibrl_* doesn't use one).
# The ONLY cold-start mechanism is the demo-mixed batch: half of every batch comes
# from the demo buffer, so the reward/Q heads always see successes even while the
# agent's own rollouts still fail. (IBRL's actor has no BC anchor either: its
# bc_loss_coef is dead because add_bc_loss=0 — so tdmpc2.bc_loss_coef stays 0.)
mix_rl_rate: 0.5
prior_margin_init: -1.0   # <0 = anneal OFF (static tdmpc2.prior_margin = 0)

# DEMO buffer (separate from the online replay; mix_rl_rate pulls from it every
# batch): the same 20 TARGET demos every other target-domain method anchors on.
demo_path: "release/data/mimicgen/threading_d0_target_dynamics/dataset.hdf5"
demo_num_data: 20

num_train_step: 400000
update_freq: 1
batch_size: 256
num_warm_up_episode: 20
pretrain_updates: 5000
warm_up_stddev: 0.1
replay_max_episode: 5000

log_per_step: 10000
num_eval_episode: 50
eval_source: 1
mp_eval: 1
use_wb: 1
seed: 1

tdmpc2:
  latent_dim: 512
  mlp_dim: 512
  num_layer: 2
  simnorm_dim: 8
  num_q: 5
  dropout: 0.01
  num_bins: 101
  vmin: -2.0
  vmax: 2.0
  mpc: 1
  horizon: 3
  iterations: 6
  num_samples: 512
  num_elites: 64
  num_pi_trajs: 24
  min_std: 0.05
  max_std: 2.0
  temperature: 0.5
  lr: 3e-4
  enc_lr_scale: 0.3
  tau: 0.01
  consistency_coef: 20.0
  reward_coef: 0.1
  value_coef: 0.1
  rho: 0.5
  ibrl: 1
  num_prior_trajs: 24
  prior_traj_std: 0.1
  prior_margin: 0.0
  clamp_q_target: 1

train_hand_init_perturb_joint_sigma: 0.1
eval_hand_init_perturb_joint_sigma: 0.1

# TARGET (§12 dynamics-only) on BOTH train and eval.
train_domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  ring_size_scale: 0.85
  ring_friction_scale: 2.0
  mask_hole_offset_in_obs: false
eval_domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  ring_size_scale: 0.85
  ring_friction_scale: 2.0
  mask_hole_offset_in_obs: false

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
  max_needle_speed: 0.0
