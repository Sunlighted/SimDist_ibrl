# Square_D0 — MimicGen BC-RNN+GMM (StateRnnGmmPolicy, open-loop) on the 1000
# official core demos, trained + evaluated on SOURCE (no shift). Candidate
# STRONGER prior than the 63% single-step MLP BC (the diagnostic showed ~half
# the IBRL gap is grasp-phase failures on hard nut orientations — a stronger,
# multimodal, chunked prior should cover those better). RNN hyperparams match
# robomimic low_dim BC-RNN-GMM (lr 1e-3, hidden 400, seq 10, 5 GMM modes).
#
# state_stack=1 (default) so it can later serve as the IBRL prior (obs space
# matches square_d0_state_ibrl_source.yaml). No strict / no domain_shift
# (Threading-only). Default σ=0.02 joint init (matches the demos).
#
#   python train_bc.py --config_path release/cfgs/mimicgen/square_d0_state_source_rnn_bc.yaml \
#       --save_dir exps/mimicgen/square_source_rnn_bc_n1000_seed1

seed: 1

dataset:
  path: release/data/mimicgen/core/square_d0/processed_data96.hdf5
  use_state: 1
  action_horizon: 10        # = Tp (MimicGen seq_length)
  build_state_chunk: 0      # open-loop RNN
  num_data: -1              # all 1000 demos
  eval_episode_len: 400
  val_ratio: 0.0            # train on all 1000 (match the MLP prior setup)

use_flow: 0
use_rnn: 1
rnn_policy:
  rnn_hidden_dim: 400
  rnn_num_layers: 2
  num_modes: 5
  min_std: 0.01
  std_activation: "softplus"
  low_noise_eval: 1
  use_tanh: 1
  pred_horizon: 10          # = dataset.action_horizon
  action_horizon: 8         # Ta (chunked eval; <= pred_horizon)
  use_ema: 0

num_epoch: 2000
epoch_len: 100
batch_size: 256
lr: 1e-3
weight_decay: 0
grad_clip: 5
use_wb: 1
num_eval_episode: 50
eval_period: 50

# eval on SOURCE (no shift), default σ=0.02 init.
eval_target_during_training: 0
eval_domain_shift:
  mode: none

save_dir: exps/mimicgen/square_source_rnn_bc_n1000_seed1
