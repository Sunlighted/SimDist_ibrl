# Coffee_D0 — MimicGen BC-RNN+GMM (StateRnnGmmPolicy, open-loop) on the 1000
# official core demos, trained + evaluated on SOURCE (no shift). This is the
# STRONGER-prior arm, held in reserve for the IBRL run.
#
# Why it exists (CLAUDE.md §32): on Square the proven lever for raising plain
# IBRL's ceiling was a stronger prior, NOT more steps — MLP prior (63%) gave
# IBRL 89.2%, RNN-GMM prior (83%) gave IBRL 97.8% over 500 games (+8.6pt,
# z=5.6). Coffee_D0 is TWO-stage (grasp pod -> insert into a 5.2 mm-clearance
# holder + close the lid), so a multimodal, chunked prior should help even more
# than it did on single-stage Square.
#
# RNN hyperparams match robomimic low_dim BC-RNN-GMM (lr 1e-3, hidden 400,
# seq 10, 5 GMM modes). state_stack=1 (default) so it can serve directly as the
# IBRL prior (obs space matches coffee_d0_state_ibrl_source.yaml). No strict /
# no domain_shift (Threading/Square-only). Default sigma=0.02 joint init.
#
#   python train_bc.py --config_path release/cfgs/mimicgen/coffee_d0_state_source_rnn_bc.yaml \
#       --save_dir exps/mimicgen/coffee_source_rnn_bc_n1000_seed1

seed: 1

dataset:
  path: release/data/mimicgen/core/coffee_d0/processed_data96.hdf5
  use_state: 1
  action_horizon: 10        # = Tp (MimicGen seq_length)
  build_state_chunk: 0      # open-loop RNN
  num_data: -1              # all 1000 demos
  eval_episode_len: 400     # official MimicGen coffee_d0 rollout horizon
  val_ratio: 0.0            # train on all 1000 (match the MLP prior setup)

use_flow: 0
use_rnn: 1
rnn_policy:
  rnn_hidden_dim: 400
  rnn_num_layers: 2
  num_modes: 5
  min_std: 0.01
  std_activation: "softplus"
  low_noise_eval: 1
  use_tanh: 1
  pred_horizon: 10          # = dataset.action_horizon
  action_horizon: 8         # Ta (chunked eval; <= pred_horizon)
  use_ema: 0

num_epoch: 2000
epoch_len: 100
batch_size: 256
lr: 1e-3
weight_decay: 0
grad_clip: 5
use_wb: 1
num_eval_episode: 50
eval_period: 50

# eval on SOURCE (no shift), default sigma=0.02 init.
eval_target_during_training: 0
eval_domain_shift:
  mode: none

save_dir: exps/mimicgen/coffee_source_rnn_bc_n1000_seed1
