# State-mode RLPD on MimicGen Stack_D0.
# Stack_D0 state shape = 32 (eef_pos[3] + eef_quat[4] + gripper_qpos[2] + object-state[23]).
# Dataset prep: see release/cfgs/mimicgen/stack_d0_state_bc.yaml header.
task_name: "Stack_D0"
episode_length: 400
stddev_max: 0.1
use_state: 1
state_stack: 3
mix_rl_rate: 0.5
preload_num_data: 10
preload_datapath: "release/data/mimicgen/core/stack_d0/processed_data96.hdf5"
num_warm_up_episode: 40
num_train_step: 200000
replay_buffer_size: 1000
use_wb: 1
mp_eval: 1
log_per_step: 10000
num_eval_episode: 50
num_critic_update: 5
q_agent:
  act_method: "rl"
  state_critic:
    num_q: 5
    layer_norm: 1
    hidden_dim: 1024
  state_actor:
    hidden_dim: 1024
    dropout: 0
