# Source-only SimDist sanity run on the real-cell Threading source replay.
# This intentionally trains on a bounded slice first:
#   8 parts * 6250 trajectories ~= 50k trajectories
#   seq_replay_max_transitions caps the in-memory buffer near the prior 100k recipe scale.
task_name: "Threading_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1
obs_stack: 1
prop_stack: 1

source_agent: "exps/mimicgen/threading_realcell_ibrl_seed1/model0.pt"
source_replay_path: "/user_data/Chenyang/ibrl_offload/release/data/mimicgen/threading_realcell_source_diverse_v1/part*.hdf5"
source_replay_num_data: 6250
seq_replay_max_episode: 60000
seq_replay_max_transitions: 12000000
bc_expert_only: 1

batch_size: 256
update_freq: 2
distill_steps: 50000
log_per_step: 5000
num_eval_episode: 20
eval_source: 1
mp_eval: 1
use_wb: 0
state_only_no_render: 1
save_dir: "exps/mimicgen/threading_realcell_simdist_sanity_seed1"

# Source-only sanity: do not adapt to target demos yet.
simdist:
  finetune_steps: 0
  finetune_dynamics: 1
  finetune_policy: 1
  finetune_lr: 0.0003
  use_planner: 0
  world_model:
    latent_dim: 512
    mlp_hidden_dim: 512
    num_layer: 2
    layer_norm: 1
    horizon: 5
    consistency_coef: 20.0
    reward_coef: 0.1
    value_coef: 0.1
    policy_coef: 10.0
    rho: 0.5
    lr: 0.0003
    tau: 0.01
    grad_clip: 20.0
    activation: "mish"
    discrete_heads: 1
    num_bins: 101
    vmin: -10.0
    vmax: 10.0
    shared_encoder: 1
    detach_pi: 1
    simnorm_dim: 8
    num_dynamics_heads: 5
  planner:
    horizon: 5
    num_samples: 512
    num_elites: 64
    iterations: 6
    mixture_coef: 0.8
    temperature: 0.5
    momentum: 0.1
    init_std: 0.5
    min_std: 0.05
    warm_start: 0

stddev_max: 0.0
stddev_min: 0.0
discount: 0.99

train_domain_shift:
  mode: "none"
eval_domain_shift:
  mode: "none"

train_hand_init_perturb_joint_sigma: 0.1
eval_hand_init_perturb_joint_sigma: 0.1

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
  max_needle_speed: 0.0
