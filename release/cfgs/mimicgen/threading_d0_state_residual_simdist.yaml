# Residual off-policy RL (ResFiT-style) on a frozen ADAPTED SimDist base.
# rl/residual_simdist_agent.py + train_residual_simdist.py.
#
# The adapted SimDist world model (threading_simdist_adapt_seed1, §24) plateaued
# at TARGET strict-success ≈ 0.75 (MPPI). A small residual RL policy continues to
# improve it: base a_base(s) via MPPI (frozen) + bounded residual, executed
# clip(base+delta,-1,1), TD3 off-policy RL. Faithful ResFiT/RLPD recipe:
#   50/50 online+offline-demo mix, LayerNorm REDQ critic, base+noise warmup,
#   critic-only warmup, TD3 target smoothing, zero-init residual, actor_lr 1e-6,
#   Q∈[0,1] clamp. The MPPI base action is computed once/step and STORED in the
#   buffer's obs (n-step via rela). Train + eval in the TARGET domain.
#
# Run:
#   python train_residual_simdist.py \
#     --config_path release/cfgs/mimicgen/threading_d0_state_residual_simdist.yaml \
#     --save_dir exps/mimicgen/threading_residual_simdist_seed1
task_name: "Threading_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1     # MUST match the adapted SimDist base's obs space
obs_stack: 1
prop_stack: 1

nstep: 5           # ResFiT n-step returns
discount: 0.99
batch_size: 256
offline_fraction: 0.5     # RLPD: half of each RL batch from the offline anchor
num_critic_update: 4      # UTD=4 (with update_freq=1)
update_freq: 1
replay_buffer_size: 500000

# base = the ADAPTED SimDist ckpt (best-by-target, ~0.75). Its dir cfg.yaml ->
# stage1_ckpt -> stage-1 cfg.yaml rebuilds the world model; MPPI forced on.
base_adapt_ckpt: "exps/mimicgen/threading_simdist_adapt_seed1/model0.pt"

# offline RLPD anchor: the 20 TARGET demos (same set SimDist stage-2 BC used),
# PLUS successful MPPI-base rollouts harvested during warmup.
offline_demo_path: "release/data/mimicgen/threading_d0_target_dynamics/dataset.hdf5"
offline_num_data: 20
offline_harvest_success: 100

# warmup = the SimDist adapt (MPPI-base) rollout that initialises the buffer.
learning_starts: 5000
warmup_noise_scale: 0.2
critic_warmup_steps: 10000

num_train_step: 100000
log_per_step: 1000        # eval every 1000 transitions
num_eval_episode: 100
mp_eval: 1
num_eval_proc: 10
use_wb: 1

stddev_max: 0.1           # residual exploration noise (residual space)
stddev_min: 0.1

# init-noise σ = 0.1 — matches the adapt run's eval_hand_init_perturb_joint_sigma
# so this is apples-to-apples with the base's ~0.75.
hand_init_perturb_joint_sigma: 0.1

residual:
  base_policy_path: ""      # UNUSED (base is the SimDist ckpt above)
  action_scale: 0.1         # v1 recipe (wider 0.2 + ensemble-mean actor COLLAPSED, 2026-07-07)
  actor_q_agg: "min"        # pessimistic min-2 (ensemble-mean collapsed on this task)
  # ramp the residual bound 0 -> action_scale over the first 5k env steps, so eval
  # STARTS at the base score (~0.75) instead of dipping — the residual grows only as
  # the critic calibrates. (The pre-fix v1 w/o this dipped to 0.48 at step 1000.)
  progressive_clipping_steps: 5000
  actor_hidden_dim: 1024
  actor_num_layer: 3
  actor_layer_norm: 1
  critic_hidden_dim: 256
  critic_num_layer: 3
  critic_layer_norm: 1
  num_critics: 10
  num_min_critics: 2
  actor_lr: 0.000001        # 1e-6 (ResFiT): residual learns slowly
  critic_lr: 0.0001         # 1e-4
  gamma: 0.99
  tau: 0.005
  policy_freq: 2
  policy_noise: 0.05        # TD3 target smoothing (residual space)
  noise_clip: 0.5
  residual_l2_coef: 0.0
  clamp_q_target: 1
  q_target_min: 0.0
  q_target_max: 1.0
  grad_clip: 10.0
  normalize_states: 1

# TARGET domain (train + eval share it): the §12 dynamics-only shift.
domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  mask_hole_offset_in_obs: false
  ring_size_scale: 0.85
  ring_friction_scale: 2.0

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
