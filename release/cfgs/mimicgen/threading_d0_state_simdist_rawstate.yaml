# SimDist RAW-STATE arm (control for the latent encoder).
# (rl/world_model.py encoder_type="identity" + rl/simdist_agent.py + train_simdist.py;
#  CLAUDE.md §17.)
#
# IDENTICAL to threading_d0_state_simdist.yaml EXCEPT world_model.encoder_type is
# "identity": no learned encoder + no SimNorm. The world model's "latent" z IS the
# z-scored raw state (dim = obs_dim), the dynamics head is a residual next-state
# predictor (z' = z + MLP([z,a])), decode is the analytic denorm inverse, and the
# policy runs directly on the normalized state. This drops the entire §17 latent
# stability machinery (SimNorm / enc_pi / decoder bridge / policy-vs-consistency
# fight) — the arm tests whether the latent helps at all on a 37-dim state.
#
# z-score stats are fit on the SOURCE replay states at the start of stage 1 and
# stored in the ckpt buffers, so eval self-normalizes.
#
# Run:
#   python train_simdist.py --config_path release/cfgs/mimicgen/threading_d0_state_simdist_rawstate.yaml \
#       --source_agent exps/mimicgen/threading_ibrl_source_seed1/model0.pt \
#       --save_dir exps/mimicgen/threading_simdist_rawstate_seed1
#
# Head-to-head vs the latent arm (same data, same coefs):
#   latent:    release/cfgs/mimicgen/threading_d0_state_simdist.yaml
#   raw-state: this file
task_name: "Threading_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1     # MUST be 1 (matches the source ckpt obs space)
obs_stack: 1
prop_stack: 1

source_agent: "exps/mimicgen/threading_ibrl_source_seed1/model0.pt"
expert_collect_steps: 0

target_demo_path: "release/data/mimicgen/threading_d0_target_dynamics/dataset.hdf5"
target_num_data: 20

batch_size: 256
update_freq: 2
num_warm_up_episode: 20
distill_steps: 400000
log_per_step: 10000
num_eval_episode: 50
eval_source: 1
mp_eval: 1
use_wb: 1
stddev_max: 0.0
stddev_min: 0.0
stddev_step: 200000
discount: 0.99

simdist:
  finetune_steps: 30000
  finetune_dynamics: 1
  finetune_policy: 1
  finetune_lr: 0.0003
  world_model:
    encoder_type: "identity"   # <-- the ONLY change vs the latent arm
    mlp_hidden_dim: 512
    num_layer: 2
    layer_norm: 1
    horizon: 5
    # NOTE: consistency is now MSE in z-scored state space (per-dim ~unit var),
    # a different scale from the SimNorm latent. Kept at 20.0 to isolate the
    # encoder change; sweep if the loss balance looks off (watch distill/consistency
    # vs distill/policy).
    consistency_coef: 20.0
    reward_coef: 1.0
    value_coef: 1.0
    policy_coef: 10.0
    rho: 0.5
    lr: 0.0003
    tau: 0.01
    grad_clip: 20.0
    # latent_dim / simnorm_dim / shared_encoder / detach_pi / decoder_coef are
    # ignored in raw-state mode (no learned encoder/decoder/enc_pi).
  planner:
    horizon: 5
    num_samples: 512
    num_elites: 64
    iterations: 6
    mixture_coef: 0.8
    temperature: 2.0
    momentum: 0.1
    init_std: 0.15
    min_std: 0.03
    warm_start: 0

# SOURCE (train, online): nominal — no shift.
train_domain_shift:
  mode: "none"

# TARGET (eval + finetune demos): dynamics-only target (CLAUDE.md §12).
eval_domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  ring_size_scale: 0.85
  ring_friction_scale: 2.0
  mask_hole_offset_in_obs: false

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
