# SimDist baseline (state-based, TD-MPC2-style latent world model + MPPI).
# (rl/world_model.py + rl/simdist_planner.py + rl/simdist_agent.py + train_simdist.py;
#  CLAUDE.md §17.)
#
# Two stages back-to-back:
#   Stage 1 (SOURCE sim, online): distill the world model. Data collection is
#     MIXED — frozen SOURCE expert (+noise) for the first `expert_collect_steps`
#     env steps, then the world model's own MPPI planner.
#   Stage 2 (offline): finetune ONLY dynamics + policy heads on the TARGET demos.
# Execution/eval = MPPI on the world model. TARGET strict-success is the metric.
#
#   SOURCE (nominal, mode=none) = online "sim" we distill in.
#   TARGET (dynamics-only)      = eval domain + finetune demos.
#
# Run:
#   python train_simdist.py --config_path release/cfgs/mimicgen/threading_d0_state_simdist.yaml \
#       --source_agent exps/mimicgen/threading_ibrl_source_seed1/model0.pt \
#       --save_dir exps/mimicgen/threading_simdist_seed1
#
# Ablations:
#   pure on-policy collection (no expert):  --expert_collect_steps 0 --source_agent none
#   finetune dynamics only (no policy):     --simdist.finetune_policy 0
task_name: "Threading_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1     # MUST be 1 (matches the source ckpt obs space)
obs_stack: 1
prop_stack: 1

# frozen SOURCE expert: guides stage-1 collection AND distills a DENSE value
# (V_src = min-ensemble Q(s,pi_src(s))) into the value head — REQUIRED, else the
# sparse-reward TD bootstrap collapses the value to 0 and MPPI has no signal.
source_agent: "exps/mimicgen/threading_ibrl_source_seed1/model0.pt"
# 0 = all-expert collection (stable + faithful to SimDist's offline expert
# data-gen). >0 = expert for N steps then MPPI self-explore (on-policy; can
# destabilize the world model on its own OOD rollouts — watch distill/consistency).
expert_collect_steps: 0

target_demo_path: "release/data/mimicgen/threading_d0_target_dynamics/dataset.hdf5"
target_num_data: 20

batch_size: 256
update_freq: 2
num_warm_up_episode: 20
distill_steps: 400000          # stage-1 online env steps
log_per_step: 10000
num_eval_episode: 50
eval_source: 1
mp_eval: 1
use_wb: 1
# CLEAN collection (no noise). The executed action IS the BC target, and on this
# precision task even small noise makes the collected expert trajectories drift/
# fail, degrading the BC data: stddev=0.0 → source 0.40 / clone err 0.03;
# stddev=0.05 → source 0.10 / clone err 0.12; stddev=0.3 → ~0. Coverage robustness
# should come from decoupling executed vs clean BC target, not from noising both
# (see §17 TODO), so until then keep collection clean.
stddev_max: 0.0
stddev_min: 0.0
stddev_step: 200000
discount: 0.99

simdist:
  finetune_steps: 30000
  finetune_dynamics: 1
  finetune_policy: 1
  finetune_lr: 0.0003
  world_model:
    latent_dim: 512
    mlp_hidden_dim: 512
    num_layer: 2
    layer_norm: 1
    horizon: 5               # H: training rollout + planning horizon
    consistency_coef: 20.0
    reward_coef: 1.0
    value_coef: 1.0
    policy_coef: 10.0
    rho: 0.5
    lr: 0.0003
    tau: 0.01
    grad_clip: 20.0
  planner:
    horizon: 5               # keep == world_model.horizon
    num_samples: 512
    num_elites: 64
    iterations: 6
    # lean on the policy proposal (see PlannerConfig comment): on sparse Threading
    # the flat V_src can't rank random candidates, so trust the clone + refine.
    mixture_coef: 0.8
    temperature: 2.0
    momentum: 0.1
    init_std: 0.15
    min_std: 0.03
    warm_start: 0            # 0 = stateless (mp-eval safe)

# SOURCE (train, online): nominal — no shift.
train_domain_shift:
  mode: "none"

# TARGET (eval + finetune demos): dynamics-only target (CLAUDE.md §12).
eval_domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  ring_size_scale: 0.85
  ring_friction_scale: 2.0
  mask_hole_offset_in_obs: false

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04


# #  
#   1. 准备环境

#   cd /home/Chenyang/ibrl
#   source /home/Chenyang/anaconda3/etc/profile.d/conda.sh && conda activate ibrl
#   source set_env.sh

#   2. 启动正式离线 distill 训练(source-only 验证)

#   后台跑、日志落盘、放 GPU0:

#   CUDA_VISIBLE_DEVICES=0 nohup python train_simdist.py \
#     --config_path release/cfgs/mimicgen/threading_d0_state_simdist.yaml \
#     --source_agent exps/mimicgen/threading_ibrl_source_seed1/model0.pt \
#     --source_replay_path release/data/mimicgen/threading_d0_source_replay/replay_buffer.hdf5 \
#     --distill_steps 100000 \
#     --simdist.finetune_steps 0 \
#     --num_eval_episode 50 \
#     --eval_source 1 \
#     --save_dir exps/mimicgen/threading_simdist_offlineB_seed1 \
#     > exps_simdist_offlineB_seed1.log 2>&1 &

#   要点:
#   - --source_replay_path ... = 开启方案 B(灌 1082 轨混合 buffer,跳过在线采集);
#   - --simdist.finetune_steps 0 = 只做 source distill,先验证 source 本身;
#   - --distill_steps 100000 = 训练更新次数(离线没 env step,想更充分就改 150000/200000);
#   - 日志里看 score/source_score(这就是你要的「source-only 训练做得好不好」),目标是超过之前在线纯 expert 的 0.70 峰值。

#   3. 看进度

#   # 实时跟日志
#   tail -f exps_simdist_offlineB_seed1.log

#   # 只看 source 成绩走势
#   grep -E "source_score *:" exps/mimicgen/threading_simdist_offlineB_seed1/train.log

#   # 看 distill 各 loss 是否健康(consistency 低、value_pred_std 不塌)
#   grep -E "distill/(consistency|value_pred_std|policy)" exps/mimicgen/threading_simdist_offlineB_seed1/train.log | tail

#   4.(可选)跑完后验 MPPI

#   训练时是 use_planner=0(policy 直出,eval 快)。跑完想确认 MPPI 路径,改这个 run 的 cfg 再 eval 同一 ckpt:

#   # 把 cfg.yaml 里的 use_planner 改成 1

#   # 把 cfg.yaml 里的 use_planner 改成 1
#   sed -i 's/use_planner: 0/use_planner: 1/' exps/mimicgen/threading_simdist_offlineB_seed1/cfg.yaml

#   # source 上对比 eval(MPPI 应 ≥ policy-only)
#   CUDA_VISIBLE_DEVICES=0 python evaluate/eval.py \
#     --weight exps/mimicgen/threading_simdist_offlineB_seed1/model0.pt \

#   # 只看 source 成绩走势
#   grep -E "source_score *:" exps/mimicgen/threading_simdist_offlineB_seed1/train.log

#   # 看 distill 各 loss 是否健康(consistency 低、value_pred_std 不塌)
#   grep -E "distill/(consistency|value_pred_std|policy)" exps/mimicgen/threading_simdist_offlineB_seed1/train.log | tail

#   4.(可选)跑完后验 MPPI

#   训练时是 use_planner=0(policy 直出,eval 快)。跑完想确认 MPPI 路径,改这个 run 的 cfg 再 eval 同一 ckpt:

#   # 把 cfg.yaml 里的 use_planner 改成 1
#   sed -i 's/use_planner: 0/use_planner: 1/' exps/mimicgen/threading_simdist_offlineB_seed1/cfg.yaml

#   # source 上对比 eval(MPPI 应 ≥ policy-only)
#   CUDA_VISIBLE_DEVICES=0 python evaluate/eval.py \
#     --weight exps/mimicgen/threading_simdist_offlineB_seed1/model0.pt \
#     --mode simdist --num_game 50 --mp 10 --seed 1 --shift_mode none

#   5.(之后)带 adaptation 的完整版

#   source 确认 OK 后,把 --simdist.finetune_steps 0 去掉(用默认 30000)就会接着做 stage-2 target 适配,score/score 是 target 成绩。