  - 0.0
  - 0.0
  mask_hole_offset_in_obs: false
  mass_scale: 1.0
  mode: fixed
  peg_friction_scale: 2.0
  peg_size_scale: 1.2
  ring_friction_scale: 1.0
  ring_size_scale: 1.0
  solimp_scale: 1.0
  solref_scale: 1.0
