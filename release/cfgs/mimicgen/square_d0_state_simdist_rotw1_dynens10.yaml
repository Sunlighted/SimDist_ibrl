# 10-head variant of square_d0_state_simdist_rotw1_dynens.yaml. ONLY
# num_dynamics_heads changes (5 -> 10), so the 5- and 10-head runs stay
# comparable; eval-time truncation then yields 1/2/3/5/7/10 from this one
# checkpoint (truncation only goes DOWN, which is why 10 rather than 7).
# NOTE the 5-head model's own 5 heads are NOT this model's first 5: the
# encoder is shared and head count changes it, so compare each model at
# its own full width, never across models at a truncated width.
# SimDist stage-1 distillation on Square_D0, rotw1 window.
#
# Mirrors square_simdist_diversev2_h5_seed1 (H=5 latent world model, single
# dynamics head, use_planner=0 for the in-training eval) with four changes:
#   * source_replay_path -> the rotw1 diverse set (200k trajs, nut yaw 120-180,
#     sigma 0.1, expert_hybrid=1 / snapshot_hybrid=0 per CLAUDE.md 17 v4).
#   * distill_steps 1000k -> 1200k (more data, longer schedule).
#   * source_agent -> the rotw1 sigma-0.1 expert that COLLECTED that data. This
#     matters: source_agent is the value-distillation teacher (V_hat regresses
#     onto its hybrid V), and the 2026-08-08 2x2 showed a planner needs a value
#     consistent with its own continuation, not merely an accurate one.
#   * train/eval_init_dist -> the rotw1 nut z_rot window, so distillation, its
#     eval, and every downstream target run share one init distribution.
batch_size: 256
bc_expert_only: 1
discount: 0.99
distill_steps: 1200000
end_on_success: 1
env_reward_scale: 1.0
episode_length: 400
eval_domain_shift:
  com_offset:
  - 0.0
  - 0.0
  - 0.0
  dr_arm_mass_range:
  - 0.9
  - 1.1
  dr_damping_range:
  - 0.7
  - 1.3
  dr_friction_range:
  - 0.7
  - 1.3
  dr_gripper_kp_range:
  - 1.0
  - 1.0
  dr_hole_offset_range:
  - 0.0
  - 0.0
  dr_mass_range:
  - 0.7
  - 1.5
  dr_ring_friction_range:
  - 1.0
  - 1.0
  dr_ring_size_range:
  - 1.0
  - 1.0
  dr_seed: 0
  dr_solimp_range:
  - 0.85
  - 1.15
  dr_solref_range:
  - 0.7
  - 1.5
  friction_scale: 1.0
  gripper_kp_scale: 0.3
  hole_offset:
