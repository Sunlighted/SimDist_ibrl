# TD-MPC2 (online model-based RL) + IBRL prior — SOURCE domain. CLAUDE.md §28.
#
# The online counterpart of the SimDist source distillation (§17): SAME latent
# world model family + SAME MPPI execution, but everything (dynamics, reward, Q,
# policy prior) is learned ONLINE by TD-MPC2's objective from the agent's own
# interaction — nothing is distilled from a frozen expert.
#
# Sparse 0/1 reward + end_on_success makes a from-scratch TD-MPC2 hopeless here
# (it would never see a success), so the IBRL prior is what makes it learnable:
# the frozen source flow-BC head both seeds the warm-up buffer with successes and
# competes with the world model's action under the LEARNED Q at every step.
#
# Prior = exps/mimicgen/threading_source_mlp_bc_n2000_seed1/model0.pt (MLP BC on
# 2000 source demos). Mirrors the TARGET arm, which also uses an MLP-BC prior.
#
# Run:
#   python train_tdmpc2.py --config_path release/cfgs/mimicgen/threading_d0_state_tdmpc2_source.yaml \
#       --save_dir exps/mimicgen/threading_tdmpc2_source_seed1
task_name: "Threading_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1
obs_stack: 1
prop_stack: 1
discount: 0.99

# IBRL prior: the frozen source MLP-BC head (plain StateBcPolicy, 2000 source
# demos). Deliberately NOT the flow-BC head that threading_ibrl_source_seed1 used:
# a deterministic MLP is the cheaper, lower-variance prior, and it is queried a lot
# here (every act + every TD target + every MPPI prior-seed).
prior_path: "exps/mimicgen/threading_source_mlp_bc_n2000_seed1/model0.pt"
prior_kind: "bc"

# Vanilla IBRL recipe (NO prior-margin anneal — threading_ibrl_* doesn't use one).
# The ONLY cold-start mechanism is the demo-mixed batch: half of every batch comes
# from the demo buffer, so the reward/Q heads always see successes even while the
# agent's own rollouts still fail. (IBRL's actor has no BC anchor either: its
# bc_loss_coef is dead because add_bc_loss=0 — so tdmpc2.bc_loss_coef stays 0.)
mix_rl_rate: 0.5
prior_margin_init: -1.0   # <0 = anneal OFF (static tdmpc2.prior_margin = 0)

# DEMO buffer (separate from the online replay; mix_rl_rate pulls from it every
# batch). 10 demos = the same preload_num_data threading_ibrl_source_strict uses.
demo_path: "release/data/mimicgen/core/threading_d0/processed_data96.hdf5"
demo_num_data: 10

num_train_step: 400000
update_freq: 1
batch_size: 256
num_warm_up_episode: 20
pretrain_updates: 5000
warm_up_stddev: 0.1
replay_max_episode: 5000

log_per_step: 10000
num_eval_episode: 50
mp_eval: 1
use_wb: 1
seed: 1

tdmpc2:
  # architecture (TD-MPC2 defaults, state-based)
  latent_dim: 512
  mlp_dim: 512
  num_layer: 2
  simnorm_dim: 8
  num_q: 5
  dropout: 0.01
  # two-hot bins: the return lives in [0,1] here (sparse 0/1 + end_on_success),
  # so the reference's symlog [-10,10] range would waste nearly all resolution.
  num_bins: 101
  vmin: -2.0
  vmax: 2.0
  # planning (MPPI/CEM). horizon 3 = the TD-MPC2 default and the horizon SimDist
  # was tuned at here.
  mpc: 1
  horizon: 3
  iterations: 6
  num_samples: 512
  num_elites: 64
  num_pi_trajs: 24
  min_std: 0.05
  max_std: 2.0
  temperature: 0.5
  # optimization
  lr: 3e-4
  enc_lr_scale: 0.3
  tau: 0.01
  consistency_coef: 20.0
  reward_coef: 0.1
  value_coef: 0.1
  rho: 0.5
  # IBRL: the learned Q arbitrates between the plan and the prior.
  ibrl: 1
  num_prior_trajs: 24
  prior_traj_std: 0.1
  prior_margin: 0.0
  clamp_q_target: 1

# demo-collection-style init (matches the source BC prior's data)
train_hand_init_perturb_joint_sigma: 0.1
eval_hand_init_perturb_joint_sigma: 0.1

# SOURCE on both train and eval.
train_domain_shift:
  mode: "none"
eval_domain_shift:
  mode: "none"

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
  max_needle_speed: 0.0
