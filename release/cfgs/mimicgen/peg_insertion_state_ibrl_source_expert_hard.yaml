# _expert_hard: demos from the CLOSED-LOOP scripted expert (scripts/collect_peg_demos.py,
# board jitter +-10 mm / +-5 deg) instead of MimicGen, whose open-loop insertion gave BC ~0.03.
# Physics/success = env/peg_insertion.py 2026-09-23 defaults (stiff walls, 30 mm, tilt <= 5 deg).
bc_policy: exps/mimicgen/peg_source_mlp_bc_expert_n1000_board_hard_seed1/model0.pt
discount: 0.99
end_on_success: 1
episode_length: 300
eval_domain_shift:
  mode: none
eval_hand_init_perturb_joint_sigma: 0.1
log_per_step: 10000
mix_rl_rate: 0.5
mp_eval: 1
nstep: 3
num_critic_update: 5
num_eval_episode: 50
num_train_step: 400000
num_warm_up_episode: 50
obs_stack: 1
preload_datapath: release/data/peg_insertion/demos_expert_n1000_board_hard/dataset.hdf5
preload_num_data: 10
prop_stack: 1
q_agent:
  act_method: ibrl
  bootstrap_method: ibrl
  ibrl_eps_greedy: 1
  state_actor:
    dropout: 0
    hidden_dim: 1024
    layer_norm: 0
    num_layer: 3
  state_critic:
    hidden_dim: 1024
    layer_norm: 1
    num_k: 2
    num_layer: 3
    num_q: 5
replay_buffer_size: 1000
save_dir: exps/mimicgen/peg_ibrl_source_expert_board_hard_seed1
seed: 1
state_stack: 1
stddev_max: 0.1
stddev_min: 0.1
task_name: PegInsertion_D0
train_domain_shift:
  mode: none
train_hand_init_perturb_joint_sigma: 0.1
board_pos_noise: 0.01
board_yaw_noise: 5.0
update_freq: 2
use_state: 1
use_wb: 0
