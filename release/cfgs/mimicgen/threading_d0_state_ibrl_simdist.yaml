# IBRL with the frozen ADAPTED SimDist base (MPPI) as the BC prior — the
# head-to-head vs the residual run (§25 / threading_d0_state_residual_simdist.yaml).
# Same base + TARGET domain; instead of a bounded residual, an RL actor from
# scratch competes with the base in IBRL max-Q, with the RLPD recipe (demo-mixed
# replay, RED-Q critic, BC-loss actor reg). The base's MPPI action is computed
# once/step and STORED in the buffer's obs (queried live only at eval).
# rl/train_ibrl_simdist.py + StoredActionBCPolicy.
#
# Run:
#   python train_ibrl_simdist.py \
#     --config_path release/cfgs/mimicgen/threading_d0_state_ibrl_simdist.yaml \
#     --save_dir exps/mimicgen/threading_ibrl_simdist_seed1
task_name: "Threading_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1     # MUST match the adapted SimDist base's obs space
obs_stack: 1
prop_stack: 1

nstep: 3
discount: 0.99
batch_size: 256
mix_rl_rate: 0.5          # RLPD: half of each RL batch = online, half = demos
num_critic_update: 5      # RED-Q
update_freq: 1
replay_buffer_size: 100000

base_adapt_ckpt: "exps/mimicgen/threading_simdist_adapt_seed1/model0.pt"
offline_demo_path: "release/data/mimicgen/threading_d0_target_dynamics/dataset.hdf5"
offline_num_data: 20

learning_starts: 5000     # env steps of MPPI-base warmup before training
num_train_step: 100000
log_per_step: 1000        # eval every 1000 transitions
num_eval_episode: 100
mp_eval: 1
num_eval_proc: 10
use_wb: 1

stddev_max: 0.1
stddev_min: 0.1

hand_init_perturb_joint_sigma: 0.1   # matches the adapt/residual eval

q_agent:
  act_method: "ibrl"
  bootstrap_method: "ibrl"
  ibrl_eps_greedy: 1
  bc_loss_coef: 0.1
  bc_loss_dynamic: 0
  lr: 0.0001
  critic_target_tau: 0.01
  stddev_clip: 0.3
  use_prop: 0
  state_actor:
    hidden_dim: 1024
    num_layer: 3
    dropout: 0.0
    layer_norm: 0
    orth: 0
  state_critic:
    num_q: 5
    num_k: 2
    num_layer: 3
    hidden_dim: 1024
    layer_norm: 1
    dropout: 0.0
    append_action: 0
    orth: 0

# TARGET domain (train + eval share it): the §12 dynamics-only shift.
domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  mask_hole_offset_in_obs: false
  ring_size_scale: 0.85
  ring_friction_scale: 2.0

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
