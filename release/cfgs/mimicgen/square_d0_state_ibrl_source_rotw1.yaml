# IBRL on Square_D0 — SOURCE domain, target = 100% source success.
#
# Uses the single-step MLP BC (square_source_mlp_bc_n1000_seed1) as the IBRL
# BC prior + 10 seed demos from the official core data. state_stack=1 so the
# MLP prior's obs space matches. No domain shift, no strict-success gating
# (both Threading-only). Default σ=0.02 joint init (matches the demos).
#
# Plain original IBRL (no prior-margin, no add_bc_loss), per request. NOTE: an
# earlier full-400k plain run should confirm whether this MLP-prior IBRL
# reaches high source success or stalls (a first 200k run sat at eval ~0.10
# with bootstrap_bc plateaued ~0.43). If it stalls, the proven lever for
# plain-IBRL source success on this codebase is a stronger FLOW BC prior
# (what threading_ibrl_source_seed1 used).
#
#   python train_rl.py --config_path release/cfgs/mimicgen/square_d0_state_ibrl_source.yaml \
#       --save_dir exps/mimicgen/square_ibrl_source_seed1
task_name: "Square_D0"
episode_length: 400
end_on_success: 1
use_state: 1
state_stack: 1
obs_stack: 1
prop_stack: 1
nstep: 3
discount: 0.99
mix_rl_rate: 0.5

# MLP BC prior + seed demos from the official core data.
bc_policy: "exps/mimicgen/square_source_mlp_bc_n1000_seed1/model0.pt"
preload_num_data: 10
preload_datapath: "release/data/mimicgen/core/square_d0/processed_data96.hdf5"
num_warm_up_episode: 50

num_train_step: 400000
replay_buffer_size: 1000
num_critic_update: 5
update_freq: 2
log_per_step: 10000
num_eval_episode: 50
mp_eval: 1
use_wb: 1
seed: 1
stddev_max: 0.1
stddev_min: 0.1

q_agent:
  act_method: "ibrl"
  bootstrap_method: "ibrl"
  ibrl_eps_greedy: 1
  state_critic:
    num_q: 5
    num_k: 2
    layer_norm: 1
    hidden_dim: 1024
    num_layer: 3
  state_actor:
    hidden_dim: 1024
    num_layer: 3
    dropout: 0
    layer_norm: 0

# SOURCE domain (no shift), no strict-success gating (both Threading-only).
train_domain_shift:
  mode: "none"
eval_domain_shift:
  mode: "none"

# ---- z_rot window ablation (rotw1): narrow SquareNut yaw to 60 deg ----
# Square_D0 samples nut z_rot over the FULL (0, 2pi); Threading_D0 uses only a
# 60 deg window. This arm narrows Square to 120-180 deg, everything else
# identical to square_d0_state_ibrl_source.yaml. Train AND eval use the same
# window (in-training eval measures this easier task); a separate full-360
# eval afterwards is what compares against square_ibrl_source_600k_seed1.
train_init_dist:
  enabled: true
  nut_z_rot: [2.0943951023931953, 3.141592653589793]
eval_init_dist:
  enabled: true
  nut_z_rot: [2.0943951023931953, 3.141592653589793]
