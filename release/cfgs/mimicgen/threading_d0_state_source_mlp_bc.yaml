# Ablation: plain single-step MLP BC (StateBcPolicy) trained directly on 2000
# SOURCE demos (no weighting, no target mixing), evaluated on the SOURCE domain
# (no shift). Measures the in-distribution source success ceiling for the same
# MLP head / schedule as threading_target_mlp_bc_n20_seed1 — the upper anchor
# for the gap-weighted experiment (train_weighted_bc.py).
#
#   python train_bc.py --config_path release/cfgs/mimicgen/threading_d0_state_source_mlp_bc.yaml \
#       --save_dir exps/mimicgen/threading_source_mlp_bc_n2000_seed1

seed: 1

dataset:
  path: release/data/mimicgen/threading_d0_source_sigma0.1/dataset.hdf5
  num_data: 2000
  use_state: 1
  state_stack: 1
  prop_stack: 1
  obs_stack: 1
  action_horizon: 1           # single-step (StateBcPolicy)
  eval_episode_len: 400
  val_ratio: 0.0

# single-step MLP head — identical to threading_target_mlp_bc_n20_seed1
state_policy:
  num_layer: 3
  hidden_dim: 1024
  dropout: 0.0
  layer_norm: 0

batch_size: 256
lr: 0.0001
weight_decay: 0.0
grad_clip: 5
num_epoch: 2000
epoch_len: 100
eval_period: 50
num_eval_episode: 50

# eval on SOURCE (no shift). eval_domain_shift.mode=none → final eval is
# source-only; eval_target_during_training=0 → in-training eval is source too.
eval_target_during_training: 0
eval_hand_init_perturb_joint_sigma: 0.1   # matches source demo collection (σ=0.1)
eval_domain_shift:
  mode: none

strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
  max_needle_speed: 0.0

use_wb: 1
save_dir: exps/mimicgen/threading_source_mlp_bc_n2000_seed1
