# Target-only flow BC on Threading_D0: train on ONLY the 20 demos collected
# under the new dynamics-only target (threading_d0_target_dynamics), eval on
# the same target. The target-only baseline for the cotrain comparison
# (see scripts/train_cotrain_flow_bc_threading.sh).
#
# Same flow head + chunking + EMA as the source / cotrain configs so the
# objective-vs-data axes are clean.
dataset:
  path: release/data/mimicgen/threading_d0_target_dynamics/dataset.hdf5
  use_state: 1
  action_horizon: 16       # = flow_policy.pred_horizon (chunk length)
  num_data: 20             # all 20 target demos
  eval_episode_len: 400
  val_ratio: 0.0           # 20 episodes — too few to hold out a val split
  # null → robosuite's σ=0.02 gaussian on joint qpos, matching the
  # target_dynamics demos' init distribution (env_cfg.json says sigma=0.02).
  hand_init_perturb: null
use_flow: 1
flow_policy:
  backbone: "unet1d"
  unet_down_dims: [64, 128, 256]
  diffusion_step_embed_dim: 128
  kernel_size: 5
  n_groups: 8
  obs_feat_dim: 128
  obs_mlp_layers: [256]
  time_scale: 1000.0
  pred_horizon: 16
  action_horizon: 8
  num_inference_steps: 10
  use_ema: 1
  ema_decay: 0.9999
num_epoch: 2000
epoch_len: 100
batch_size: 256
lr: 1e-4
weight_decay: 1e-6
use_wb: 1
num_eval_episode: 50
eval_period: 50
val_period: 10
val_batches: 5
eval_hand_init_perturb: null
# In-training eval runs on TARGET (since target IS the only training domain
# here). topk saver picks model0/1.pt by target success rate. The
# post-training dual eval then also reports source for the gap.
eval_target_during_training: 1
eval_domain_shift:
  mode: "fixed"
  friction_scale: 0.5
  mass_scale: 3.0
  solref_scale: 1.0
  solimp_scale: 1.0
  gripper_kp_scale: 0.12
  hole_offset: [0.0, 0.0, 0.0]
  ring_size_scale: 0.85
  ring_friction_scale: 2.0
  mask_hole_offset_in_obs: false
# Strict-success gate at eval (same as the RL/H2O+ evals) so BC and RL numbers
# are comparable. Rejects clip-through / ram / shove-the-ring false positives.
strict_success:
  enabled: true
  dwell_steps: 3
  max_tripod_disp: 0.04
